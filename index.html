<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C6C6B4">
<meta name="description" content="王裔天 Yitian Wang (Tina) · 观众研究 × 展览实践 · 伦敦 / 上海">
<title>王裔天 Yitian Wang</title>
<style>
/* Layout (Atlason direction):
   Landscape screens (desktop, sideways iPad): one white band of four joined columns, centred on a coloured wall.
   Portrait screens (phone, upright iPad): four small white cards in a centred column.
   A column opens into a "room": a white sheet on the same wall. The About room uses a warmer wall. */
@font-face{font-family:"Hanken Grotesk";src:url("fonts/hanken-grotesk-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Hanken Grotesk";src:url("fonts/hanken-grotesk-500.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Hanken Grotesk";src:url("fonts/hanken-grotesk-600.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
:root{
  --wall:#C6C6B4;       /* 灰苔 grey moss: the wall behind everything */
  --wall-about:#CEC7BB; /* 暖石 warm stone: the About room */
  --paper:#ffffff;
  --ink:#111111;
  --ink-soft:#75756f;   /* labels, captions */
  --rule:#e3e3de;
  --accent:#111111;
  --slot:#efefec;
  --sans:"Hanken Grotesk","Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --s-title:clamp(30px,3.4vw,44px);
  --s-h2:clamp(22px,2.1vw,30px);
  --s-h3:clamp(18px,1.6vw,22px);
  --s-body:16px;
  --s-small:13px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--sans);font-size:var(--s-body);font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background-color .5s ease}
body.room-about{background:var(--wall-about)}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
html[data-lang="zh"] .en,html[data-lang="en"] .zh{display:none!important}
html[data-lang="zh"] body{line-height:1.75}

.bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center}
.bg-note{position:fixed;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:3;font:11px/1.4 var(--mono);background:var(--paper);padding:4px 8px}

/* top bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;pointer-events:none}
.bar>*{pointer-events:auto}
.bar{transition:transform .6s var(--ease-in,ease)}
body.in-room.scroll-down .bar{transform:translateY(-110%)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--paper);color:var(--ink);border:0;font:500 13px/1 var(--sans);padding:10px 14px;min-height:36px;text-decoration:none;cursor:pointer}
@media (hover:hover){.chip:hover{background:var(--ink);color:var(--paper)}}
.bar .lang{margin-left:auto}
.lang b{font-weight:500}.lang b.off{color:var(--ink-soft);font-weight:400}
@media (hover:hover){.chip:hover b.off{color:var(--paper)}}
.home-link{display:none!important}
body.in-room .home-link{display:inline-flex!important;animation:chip-in .5s .5s ease both}
@keyframes chip-in{from{opacity:0}to{opacity:1}}
body.in-room .bg-note{display:none}

/* ---------- home ---------- */
main.home{position:relative;z-index:2;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;
  padding:calc(64px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.band{display:flex;flex-direction:column;align-items:center;gap:12px}
.col{position:relative;background:var(--paper);color:var(--ink);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.col-in{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;transform-origin:50% 10px;transition:transform .5s cubic-bezier(.4,0,.2,1)}
@media (hover:hover){body:not(.is-busy) .col:hover .col-in{transform:scale(.98)}}
.col:active .col-in{transform:scale(.98)}
.col a{text-decoration:none}
.col h2{margin:0;font-weight:500;line-height:.95;letter-spacing:-.022em;white-space:nowrap}
html[data-lang="zh"] .col h2{line-height:1.1;letter-spacing:0}
.col .soft{color:var(--ink-soft)}
.fill{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background:var(--slot)}
.fill img,.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 50%);display:block}
.spacer{flex:1 1 auto}
.finds{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.slogan{margin:0;font-weight:500}
.info{display:grid;font-weight:400}
.info>div{display:flex;flex-direction:column;min-width:0}
.info a:hover,.tabs a:hover,.col h2 a:hover{text-decoration:underline;text-underline-offset:3px}
.tabs{display:flex;font-weight:500}
.tabs .on{border-bottom:2px solid var(--accent)}
.masonry{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.masonry>div{display:flex;flex-direction:column;min-width:0}
.tile{display:flex;flex-direction:column;min-width:0}
.thumb{position:relative;display:block;overflow:hidden;background:var(--slot);aspect-ratio:var(--ar,1)}
.tile span{font-weight:400;line-height:1.2}
.line{height:2px;width:40px;background:var(--accent)}
.d-only{display:none!important}
.col h2 a::after{content:"";position:absolute;inset:0;z-index:0}
.info a,.tabs a,.tile{position:relative;z-index:1}
.thumb{aspect-ratio:var(--arm,1)}

/* portrait: a column of small cards (sizes follow the card, via container queries) */
/* note: a container's own padding can't use cqi (it would measure the viewport), so it uses --ch */
.col{--ch:clamp(124px,calc((100svh - 150px) / 4),250px);width:calc(var(--ch) * 1.28);height:var(--ch);container-type:size}
.col-in{padding:calc(var(--ch) * .042) calc(var(--ch) * .046) calc(var(--ch) * .05);gap:calc(var(--ch) * .034)}
.col h2{font-size:11.8cqi}
html[data-lang="zh"] .col h2{font-size:9.2cqi}
.c-about .col-in{padding:0;gap:0}
.c-about h2{padding:3.4cqi 3.6cqi 2.8cqi}
.c-about .info{grid-template-columns:repeat(2,max-content);gap:5.5cqi;padding:2.4cqi 3.6cqi 2.8cqi;font-size:max(9px,3.6cqi);line-height:1.25}
.c-research .finds{gap:1.2cqi;font-size:max(11px,5cqi);line-height:1.15;font-weight:500}
html[data-lang="zh"] .c-research .finds{line-height:1.35}
.c-research .slogan{font-size:max(12px,5.9cqi);line-height:1.12;letter-spacing:-.01em}
html[data-lang="zh"] .c-research .slogan{font-size:max(12px,5.4cqi);line-height:1.4;letter-spacing:0}
.c-exhibitions .col-in{padding-bottom:0}
.c-exhibitions .tabs{gap:3.6cqi;font-size:max(10px,4.5cqi);margin-top:-.6cqi}
.c-exhibitions .tabs .on{border-bottom-width:1.5px}
.masonry{gap:2.3cqi}.masonry>div{gap:2.3cqi}
.c-exhibitions .tile span{display:none}
.c-museums .note{margin:0;font-size:max(10px,5cqi);line-height:1.15;font-weight:500}
html[data-lang="zh"] .c-museums .note{line-height:1.35}

/* landscape: one band of joined columns (sizes follow the band) */
@media (orientation:landscape) and (min-width:900px) and (min-height:460px){
  .band{flex-direction:row;align-items:stretch;gap:0;container-type:size;
    width:min(1200px,84vw,calc((100svh - 170px) * 2));aspect-ratio:2/1}
  .col{width:auto;height:auto;container-type:normal;flex:var(--f) 1 0}
  .col-in{padding:.83cqw 1cqw 1.15cqw;gap:0}
  .c-about{--f:40}.c-research{--f:25}.c-exhibitions{--f:32}.c-museums{--f:23}
  .c-about .col-in{padding:0}.c-exhibitions .col-in{padding-bottom:0}
  .d-only{display:revert!important}.m-only{display:none!important}
  .info div.d-only,.tile.d-only,.c-museums .places.d-only{display:flex!important}
  .thumb{aspect-ratio:var(--ar,1)}
  .col h2{font-size:max(26px,3.67cqw);letter-spacing:-.023em}
  html[data-lang="zh"] .col h2{font-size:max(22px,2.83cqw)}
  .c-about h2{padding:.83cqw 1cqw 1cqw}
  .c-research h2,.c-museums h2{margin-bottom:1.15cqw}
  .c-exhibitions h2{margin-bottom:.5cqw}
  .c-about .info{grid-template-columns:repeat(4,minmax(0,1fr));gap:.83cqw;padding:1cqw;font-size:max(10px,.92cqw);line-height:1.3}
  .c-research .finds{gap:.67cqw;font-size:max(13px,1.5cqw);line-height:1.1;letter-spacing:-.01em}
  html[data-lang="zh"] .c-research .finds{font-size:max(13px,1.33cqw);line-height:1.35;letter-spacing:0}
  .eyebrow{margin:0 0 .67cqw;font-size:max(10px,.92cqw);color:var(--ink-soft);font-weight:400}
  .c-research .slogan,.c-museums .slogan{font-size:max(15px,1.83cqw);line-height:1.08;letter-spacing:-.014em}
  html[data-lang="zh"] .c-research .slogan,html[data-lang="zh"] .c-museums .slogan{font-size:max(14px,1.58cqw);line-height:1.4;letter-spacing:0}
  .line{margin-top:1.15cqw}
  .c-exhibitions .tabs{gap:1.15cqw;font-size:max(13px,1.5cqw);margin:0 0 1cqw}
  html[data-lang="zh"] .c-exhibitions .tabs{font-size:max(13px,1.33cqw)}
  .masonry{gap:.67cqw}.masonry>div{gap:.67cqw}
  .c-exhibitions .tile{gap:.33cqw}
  .c-exhibitions .tile span{display:block;font-size:max(9.5px,.875cqw)}
  .c-museums .places{display:flex;flex-direction:column;gap:.67cqw;margin-bottom:1.15cqw;font-size:max(13px,1.5cqw);line-height:1.1;font-weight:500;letter-spacing:-.01em}
  html[data-lang="zh"] .c-museums .places{font-size:max(13px,1.33cqw);line-height:1.35;letter-spacing:0}
  .c-museums .slogan{margin-top:.83cqw}
}

/* ---------- shared bits used in rooms ---------- */
.meta{font-size:var(--s-small);color:var(--ink-soft);line-height:1.5;margin:0}
.figures{display:flex;flex-wrap:wrap;gap:8px 28px;margin:0;padding:0;list-style:none}
.figures li{display:flex;flex-direction:column;font-size:var(--s-small);color:var(--ink-soft)}
.figures b{font-size:clamp(26px,2.4vw,34px);font-weight:500;color:var(--ink);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.more{align-self:flex-start;font-weight:500;text-decoration:none;border-bottom:1.5px solid var(--ink);padding-bottom:2px}
.more:hover{border-color:transparent}

.index{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink);scroll-margin-top:80px}
.index a{display:grid;grid-template-columns:4.6em 1fr;gap:2px 12px;padding:11px 0;border-bottom:1px solid var(--rule);text-decoration:none;align-items:baseline}
.index a:hover .t{text-decoration:underline;text-underline-offset:3px}
.index .y{font-size:var(--s-small);font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.index .t{font-weight:500;line-height:1.3}
.index .r{grid-column:2;font-size:var(--s-small);color:var(--ink-soft);line-height:1.4}

/* photo slots */
.ph{margin:0;position:relative;aspect-ratio:4/3;max-width:100%;background:var(--slot);overflow:hidden}
.ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 50%)}
.ph.portrait{aspect-ratio:3/4}
.ph.full.loaded{aspect-ratio:auto;background:none}
.ph.full:not(.loaded){aspect-ratio:3/4}
.ph.full img{height:auto;object-fit:contain}
.ph .slot{position:absolute;inset:0;display:flex;align-items:flex-end;padding:10px;font:12px/1.3 var(--mono);color:var(--ink-soft);border:1px dashed #b9b9b6}
.ph.loaded .slot{display:none}

/* ---------- rooms: a white sheet on the wall ---------- */
.room{position:relative;z-index:2;display:none;min-height:100vh;min-height:100svh;padding:calc(64px + env(safe-area-inset-top,0px)) 12px 48px}
.room.open{display:block}

/* ---------- motion (after atlason.com): a column zooms out into its page; pages slide up over each other ---------- */
:root{--ease-in:cubic-bezier(.54,.15,.15,1);--ease-out:cubic-bezier(.85,0,.45,.85)}
body{transition:background-color 1s var(--ease-in)}
body.is-busy main.home,body.is-busy .room{pointer-events:none}
.zoom{position:fixed;z-index:30;background:var(--paper);overflow:hidden;pointer-events:none;will-change:left,top,width,height}
.zoom-title{position:absolute;left:0;top:0;margin:0;font-weight:500;white-space:nowrap;transform-origin:0 0;will-change:transform}
.room.measure{display:block!important;visibility:hidden!important;position:absolute!important;top:0;left:0;right:0}
.room.enter .room-inner>*:not(header){animation:fade-up .7s var(--ease-in) both}
.room.enter .room-inner>*:nth-child(2){animation-delay:.06s}
.room.enter .room-inner>*:nth-child(3){animation-delay:.12s}
.room.enter .room-inner>*:nth-child(n+4){animation-delay:.18s}
.room.enter .room-lead{animation:fade-up .7s var(--ease-in) both}
@keyframes fade-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.room.slide-in{z-index:5;background:var(--wall-now,var(--wall));animation:to-top 1s var(--ease-in) both}
.room.leaving{display:block!important;position:fixed!important;left:0;right:0;z-index:1;animation:dim 1s var(--ease-in) both}
@keyframes to-top{from{transform:translateY(100vh)}to{transform:none}}
@keyframes dim{to{opacity:.35}}
.band.load .col{animation:fade-up .9s var(--ease-in) both}
.band.load .col:nth-child(2){animation-delay:.08s}.band.load .col:nth-child(3){animation-delay:.16s}.band.load .col:nth-child(4){animation-delay:.24s}
@media (prefers-reduced-motion:reduce){
  body,.col-in{transition:none!important}
  body.in-room .home-link{animation:none}
  .room.enter .room-inner>*,.room.slide-in,.room.leaving,.band.load .col{animation:none!important}
}
.room-inner{max-width:1200px;margin:0 auto;background:var(--paper);padding:18px 16px 28px;display:flex;flex-direction:column;gap:48px}
.room-title{margin:0;font-size:var(--s-title);font-weight:500;letter-spacing:-.023em;line-height:1}
html[data-lang="zh"] .room-title{font-size:calc(var(--s-title) * .78);letter-spacing:0;line-height:1.15}
.room-lead{margin:12px 0 0;max-width:40em;color:var(--ink-soft)}

.entry{display:grid;grid-template-columns:1fr;gap:22px;border-top:1px solid var(--ink);padding-top:20px;scroll-margin-top:80px}
.split{display:grid;grid-template-columns:1fr;gap:22px;min-width:0}
.split>.head{display:flex;flex-direction:column;gap:16px;min-width:0}
.entry h3{margin:0;font-size:var(--s-h2);font-weight:500;letter-spacing:-.018em;line-height:1.1;text-wrap:balance}
html[data-lang="zh"] .entry h3{letter-spacing:0;line-height:1.3}
.entry h3 .sub{display:block;font-size:max(14px,.55em);font-weight:400;letter-spacing:0;color:var(--ink-soft);margin-top:8px;line-height:1.35}
.label{margin:0;display:grid;grid-template-columns:5.5em 1fr;gap:6px 14px;font-size:14px;line-height:1.5}
html[data-lang="en"] .label{grid-template-columns:6.5em 1fr}
.label dt{color:var(--ink-soft)}
.label dd{margin:0;min-width:0;font-variant-numeric:tabular-nums}
.body{min-width:0;display:flex;flex-direction:column;gap:18px;max-width:44em}
.body p{margin:0}
.body b{font-weight:600}
.body ul,.body ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.body ul,.body ul ul,.themes ul{list-style-type:disc}
.body h4{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--ink-soft)}
.body h4+*{margin-top:-8px}
.pending{color:var(--ink-soft);font-size:14px}
.gallery{columns:2;column-gap:8px}
.gitem{display:inline-block;width:100%;vertical-align:top;break-inside:avoid;-webkit-column-break-inside:avoid;margin-bottom:8px;text-decoration:none;cursor:zoom-in}
.gitem .gcap{display:block;margin-top:5px}
/* 1–3 photos: side by side in a row instead of stacked columns */
.gallery.few{columns:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:start}
.gallery.few .gitem{margin-bottom:0}
@media (min-width:700px){.gallery.few{grid-template-columns:repeat(max(var(--n),2),minmax(0,1fr));gap:12px}}
.gitem .ph{transition:opacity .3s}
@media (hover:hover){.gitem:hover .ph{opacity:.88}}
.gcap{font-size:12px;line-height:1.4;color:var(--ink-soft);padding-bottom:2px}

.principles{list-style:none;padding:0!important;counter-reset:p;gap:16px!important}
.principles li{counter-increment:p;display:grid;grid-template-columns:2em 1fr;gap:4px}
.principles li::before{content:counter(p);font-weight:500}
.principles b{display:block}

.methods{width:100%;border-collapse:collapse;font-size:15px;min-width:520px}
.methods th,.methods td{text-align:left;vertical-align:top;padding:10px 12px 10px 0;border-bottom:1px solid var(--rule)}
.methods th{font-size:var(--s-small);color:var(--ink-soft);font-weight:400;border-bottom:1px solid var(--ink)}
.methods b{font-weight:500}
.scroll{overflow-x:auto;max-width:100%}
.findings{list-style:none;padding:0!important;gap:20px!important}
.findings li{display:grid;grid-template-columns:2em 1fr;gap:4px 8px}
.findings .n{font-size:var(--s-h3);font-weight:500;line-height:1.25}
.findings b{display:block;font-size:var(--s-h3);font-weight:500!important;line-height:1.25;letter-spacing:-.01em;margin-bottom:4px}
.themes{list-style:none;padding:0!important;gap:28px!important}
.themes>li{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--rule);padding-top:14px}
.themes>li:first-child{border-top:0;padding-top:0}
.theme-t{margin:0;font-size:var(--s-h3);font-weight:500;line-height:1.25;letter-spacing:-.01em}
.theme-t .n{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;font-weight:500}
.themes ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.site-photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 8px;align-items:start}
.site-photos figure:first-child{grid-row:span 2}
.site-photos figure{margin:0;display:flex;flex-direction:column;gap:6px}
.site-photos figcaption{font-size:12px;color:var(--ink-soft);line-height:1.4}
.big-idea{border-top:1px solid var(--ink);padding-top:18px;display:flex;flex-direction:column;gap:12px}
.big-idea p:last-child{margin:0;font-size:clamp(24px,2.8vw,40px);line-height:1.15;font-weight:500;letter-spacing:-.02em;max-width:24em;text-wrap:balance}
html[data-lang="zh"] .big-idea p:last-child{white-space:pre-line;font-size:clamp(20px,2.2vw,32px);line-height:1.45;letter-spacing:0}
.voices{list-style:none;padding:0!important}

/* ---------- lightbox: tap a photo in Exhibitions or Museums to see it large ---------- */
.lb{position:fixed;inset:0;z-index:40;display:grid;grid-template-rows:auto 1fr;background:var(--wall-now,var(--wall));
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:36px}
.lb-count{font-size:13px;color:var(--ink);background:var(--paper);padding:10px 14px;line-height:1}
.lb-stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 0 0}
.lb-fig{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%;max-height:100%;min-height:0}
.lb-img{display:block;max-width:min(100%,1400px);max-height:calc(100svh - 150px);width:auto;height:auto;object-fit:contain;background:var(--paper);transform-origin:0 0;user-select:none;-webkit-user-drag:none}
.lb-cap{font-size:13px;line-height:1.45;color:var(--ink);text-align:center;max-width:40em;min-height:1.45em}
.lb-cap .t{color:var(--ink-soft)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
@media (hover:hover){.lb-nav:hover{background:var(--ink);color:var(--paper)}}
.lb-prev{left:0}.lb-next{right:0}

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const L = p => Array.isArray(p) ? (p[0]===p[1] ? esc(p[0]) : `<span class="zh">${esc(p[0])}</span><span class="en">${esc(p[1])}</span>`) : esc(p);
const ARROW = `<svg class="arrow" viewBox="0 0 44 32" aria-hidden="true"><path d="M2 16h38M26 2l14 14-14 14" fill="none" stroke="currentColor" stroke-width="3.2"/></svg>`;
const ph = (name, cls="", crop=null) => crop
  ? `<figure class="ph ${cls}" style="aspect-ratio:${crop.ar};--pos:${crop.pos}" data-src="${THUMB}${name}.jpg"><span class="slot">${name}.jpg</span></figure>`
  : `<figure class="ph ${cls}${FULL.includes(name)?" full":""}" data-src="${THUMB}${name}.jpg"><span class="slot">${name}.jpg</span></figure>`;
const label = rows => `<dl class="label">${rows.map(r=>`<dt>${L(r[0])}</dt><dd>${L(r[1])}</dd>`).join("")}</dl>`;
const ext = (url, text) => `<a class="more" href="${esc(url)}" target="_blank" rel="noopener">${L(text)} ↗</a>`;

function entry(e){
  let body = "";
  if (e.intro) body += `<p>${L(e.intro)}</p>`;
  if (e.points) body += e.points.length>1 ? `<ul>${e.points.map(p=>`<li>${L(p)}</li>`).join("")}</ul>` : `<p>${L(e.points[0])}</p>`;
  if (e.principles) body += `<h4>${L(["设计理念","Design approach"])}</h4><ol class="principles">${e.principles.map(p=>`<li><span><b>${L(p[0])}</b>${L(p[1])}</span></li>`).join("")}</ol>`;
  if (e.extra) body += `<h4>${L(e.extra[0])}</h4><p>${L(e.extra[1])}</p>`;
  const links = [];
  if (e.press) links.push(ext(e.press[0], e.press[1]));
  if (e.link) links.push(ext(e.link[0], e.link[1]));
  if (e.links) e.links.forEach(l=>links.push(ext(l[0], l[1])));
  if (links.length) body += `<div style="display:flex;flex-wrap:wrap;gap:12px 24px">${links.join("")}</div>`;
  if (e.pressPending && SHOW_SLOTS) body += `<p class="pending">${L(["媒体报道：即将发布","Press coverage: coming soon"])}</p>`;
  const gallery = e.photos && e.photos.length ? `<div class="gallery${e.photos.length<=3?" few":""}" style="--n:${e.photos.length}" data-title="${esc(e.title[0])}|${esc(e.title[1])}">${e.photos.map(n=>`<a class="gitem" href="${IMG}${n}.jpg" data-name="${n}">${ph(n,"",CROP[n])}${CAPTIONS[n]?`<span class="gcap">${L(CAPTIONS[n])}</span>`:""}</a>`).join("")}</div>` : "";
  return `<article class="entry" id="${e.id}"><div class="split">
    <div class="head"><h3>${L(e.title)}<span class="sub">${L(e.sub)}</span></h3>${label(e.label)}</div>
    <div class="body">${body}</div></div>${gallery}</article>`;
}

  const ex = roomShell("exhibitions", ["从独立策展到现场执行，从伦敦到上海。","From curating to running the floor, in London and Shanghai."], `<ul class="index" id="index">${C.exhibitions.map(i=>`<li><a href="#exhibitions-${i.id}"><span class="y">${esc(i.year)}</span><span class="t">${L(i.title)}</span><span class="r">${L(i.short)}</span></a></li>`).join("")}</ul>` + C.exhibitions.map(entry).join(""));
  const mu = roomShell("museums", ["在博物馆内部，看一个展览和一场活动是怎样被准备出来的。","Inside museums, seeing how exhibitions and programmes get made."], C.museums.map(entry).join(""));
  const a = C.about;
  const ab = roomShell("about", null, `
    <div class="about-photos">${a.photos.map(n=>ph(n,"portrait")).join("")}</div>

      <div class="head"><h3>${L(C.sections.about)}<span class="sub">${L(C.subline)}</span></h3>
        <dl class="label contact"><dt>${L(["邮箱","Email"])}</dt><dd><a href="mailto:${a.email}">${a.email}</a></dd><dt>LinkedIn</dt><dd><a href="${a.linkedin}" target="_blank" rel="noopener">linkedin.com/in/yitian-wang-858400280</a></dd></dl></div>

        ${a.interview ? ext(a.interview[0], a.interview[1]) : (SHOW_SLOTS ? `<p class="pending">${L(["个人专访：即将发布","Interview: coming soon"])}</p>` : "")}

/* photos: show if the file exists, otherwise show a slot (or hide it) */
/* photos load only when they come near the screen, so a slow connection gets the first ones first */
function loadOne(f){
  const img = new Image(); img.alt = ""; img.decoding = "async";
  img.onload = ()=>{ f.prepend(img); f.classList.add("loaded"); };
  img.onerror = ()=>{ if(!SHOW_SLOTS) (f.closest(".gitem")||f).remove(); };
  img.src = f.dataset.src;
}
const PHOTO_IO = "IntersectionObserver" in window ? new IntersectionObserver(es=>{
  es.forEach(e=>{ if (e.isIntersecting){ PHOTO_IO.unobserve(e.target); loadOne(e.target); } });
}, {rootMargin:"600px 0px"}) : null;
function loadPhotos(scope){
  scope.querySelectorAll(".ph[data-src]:not([data-req])").forEach(f=>{
    f.dataset.req = "1";
    if (PHOTO_IO) PHOTO_IO.observe(f); else loadOne(f);
  });
}
/* 背景：竖屏（手机、竖放的 iPad）用竖图，横屏（电脑、横放的 iPad）用横图 */
const PORTRAIT = window.matchMedia("(orientation: portrait)");
/* 背景照片开关：false = 用纯色背景（颜色在 CSS 的 --ground） */
const BG_PHOTO = false;
function loadBackground(){
  if (!BG_PHOTO) return;
  const file = PORTRAIT.matches ? "background-portrait.jpg" : "background.jpg";
  const bg = new Image();
  bg.onload = ()=>{ document.getElementById("bg").style.backgroundImage = `url("${IMG}${file}")`; };
  bg.onerror = ()=>{ if (SHOW_SLOTS) document.getElementById("bgNote").hidden = false; };
  bg.src = IMG + file;
}

/* language */
function setLang(l){
  document.documentElement.dataset.lang = l;
  document.documentElement.lang = l==="zh" ? "zh-CN" : "en";
  document.querySelectorAll("#langBtn b").forEach(b=>b.className = b.dataset.l===l ? "" : "off");
  try{ localStorage.setItem("wytina-lang", l); }catch(e){}
}
document.getElementById("langBtn").addEventListener("click",()=>{
  setLang(document.documentElement.dataset.lang==="zh" ? "en" : "zh");
});

/* routing: #research, #exhibitions-threshold, ...
   Motion follows atlason.com: from home, the column grows into its page (and back);
   between pages, the next page slides up over the last one. */
const EASE_IN = "cubic-bezier(.54,.15,.15,1)";
const DUR = 1000;
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)");
let current = null, busy = false;

function parse(){
  const h = location.hash.replace("#","");
  const key = ORDER.find(k => h===k || h.startsWith(k+"-")) || null;
  const item = key && h.startsWith(key+"-") ? h.slice(key.length+1) : null;
  return {key, item};
}
function show(key, item, opts={}){
  document.querySelectorAll(".room").forEach(r=>{ if(!r.classList.contains("leaving")) r.classList.remove("open","enter","slide-in"); });
  document.getElementById("home").hidden = !!key;
  document.body.classList.toggle("in-room", !!key);
  document.body.classList.toggle("room-about", key==="about");
  if (key){
    const room = document.getElementById("room-"+key);
    room.classList.add("open"); if (opts.cls) room.classList.add(opts.cls);
    loadPhotos(room);
    window.scrollTo(0,0);
    if (item) scrollToItem(item, opts.animated);
    return room;
  }
  window.scrollTo(0,0);
  return null;
}
function scrollToItem(id, animated){
  const el = document.getElementById(id); if (!el) return;
  if (animated && !REDUCED.matches) setTimeout(()=>el.scrollIntoView({behavior:"smooth"}), 350);
  else requestAnimationFrame(()=>el.scrollIntoView());
}
const box = r => ({left:r.left+"px", top:r.top+"px", width:r.width+"px", height:r.height+"px"});
const fs = el => parseFloat(getComputedStyle(el).fontSize);

/* a white sheet with the page title in it, used to carry the eye between home and a room */
function makeSheet(rect, titleEl, titleRect){
  const z = document.createElement("div"); z.className = "zoom"; Object.assign(z.style, box(rect));
  const t = document.createElement("p"); t.className = "zoom-title";
  const src = titleEl.querySelector("a") || titleEl; t.innerHTML = src.innerHTML;
  const cs = getComputedStyle(titleEl);
  Object.assign(t.style, {fontSize:cs.fontSize, lineHeight:cs.lineHeight, letterSpacing:cs.letterSpacing});
  z.appendChild(t); document.body.appendChild(z);
  return {z, t};
}
function measureRoom(key){
  const room = document.getElementById("room-"+key);
  room.classList.add("measure");
  const inner = room.querySelector(".room-inner"), title = room.querySelector(".room-title");
  const ir = inner.getBoundingClientRect(), tr = title.getBoundingClientRect(), y = window.scrollY;
  const sheet = {left:ir.left, top:ir.top + y, width:ir.width, height:Math.min(ir.height, window.innerHeight - (ir.top + y))};
  const t = {left:tr.left, top:tr.top + y, size:fs(title)};
  room.classList.remove("measure");
  return {sheet, t};
}
function done(fn){ return new Promise(r=>setTimeout(r, fn)); }

async function zoomIn(key, item){
  const col = document.querySelector(".c-"+key);
  if (REDUCED.matches || !col || document.getElementById("home").hidden){ show(key, item); return; }
  busy = true; document.body.classList.add("is-busy");
  const r0 = col.getBoundingClientRect(), h = col.querySelector("h2"), h0 = h.getBoundingClientRect();
  const {sheet, t} = measureRoom(key);
  const {z, t:title} = makeSheet(r0, h);
  const s0 = fs(h), k = t.size / s0;
  const from = {x:h0.left - r0.left, y:h0.top - r0.top}, to = {x:t.left - sheet.left, y:t.top - sheet.top};
  title.style.transform = `translate(${from.x}px,${from.y}px)`;
  if (key==="about") document.body.classList.add("room-about");
  document.querySelectorAll(".col").forEach(c=>{ if(c!==col) c.animate([{opacity:1,transform:"none"},{opacity:0,transform:"scale(.985)"}],{duration:450,easing:"ease",fill:"forwards"}); });
  const opt = {duration:DUR, easing:EASE_IN, fill:"forwards"};
  z.animate([box(r0), box(sheet)], opt);
  title.animate([{transform:`translate(${from.x}px,${from.y}px) scale(1)`},{transform:`translate(${to.x}px,${to.y}px) scale(${k})`}], opt);
  await done(DUR);
  show(key, item, {cls:"enter", animated:true});
  document.querySelectorAll(".col").forEach(c=>c.getAnimations().forEach(a=>a.cancel()));
  requestAnimationFrame(()=>{ z.remove(); busy = false; document.body.classList.remove("is-busy"); });
}

async function zoomOut(prev){
  const room = document.getElementById("room-"+prev);
  if (REDUCED.matches || !room){ show(null); return; }
  busy = true; document.body.classList.add("is-busy");
  const inner = room.querySelector(".room-inner"), rt = room.querySelector(".room-title");
  const ir = inner.getBoundingClientRect(), tr = rt.getBoundingClientRect();
  const top = Math.max(ir.top, 0);
  const r0 = {left:ir.left, top, width:ir.width, height:Math.max(80, Math.min(ir.bottom, window.innerHeight) - top)};
  const {z, t:title} = makeSheet(r0, rt);
  const titleVisible = tr.bottom > 0;
  const from = titleVisible ? {x:tr.left - r0.left, y:tr.top - r0.top} : {x:tr.left - r0.left, y:28};
  document.body.classList.remove("room-about");
  show(null);
  const col = document.querySelector(".c-"+prev);
  const cols = [...document.querySelectorAll(".col")];
  cols.forEach(c=>c.style.opacity = "0");
  const r1 = col.getBoundingClientRect(), h = col.querySelector("h2"), h1 = h.getBoundingClientRect();
  const k = fs(rt) / fs(h);
  const to = {x:h1.left - r1.left, y:h1.top - r1.top};
  const opt = {duration:DUR, easing:EASE_IN, fill:"forwards"};
  z.animate([box(r0), box(r1)], opt);
  title.animate([{transform:`translate(${from.x}px,${from.y}px) scale(${k})`, opacity:titleVisible?1:0},{transform:`translate(${to.x}px,${to.y}px) scale(1)`, opacity:1}], opt);
  cols.forEach(c=>{ if(c!==col) c.animate([{opacity:0,transform:"scale(.985)"},{opacity:1,transform:"none"}],{duration:600,delay:DUR*.55,easing:"ease",fill:"forwards"}); });
  await done(DUR);
  cols.forEach(c=>{ c.style.opacity = ""; c.getAnimations().forEach(a=>a.cancel()); });
  requestAnimationFrame(()=>{ z.remove(); busy = false; document.body.classList.remove("is-busy"); });
}

async function slideTo(prev, key, item){
  const old = document.getElementById("room-"+prev);
  if (REDUCED.matches || !old){ show(key, item); return; }
  busy = true; document.body.classList.add("is-busy");
  old.style.top = (-window.scrollY) + "px";
  old.classList.add("leaving");
  const wall = getComputedStyle(document.documentElement).getPropertyValue(key==="about" ? "--wall-about" : "--wall");
  const room = show(key, null, {cls:"slide-in"});
  room.style.setProperty("--wall-now", wall);
  await done(DUR);
  old.classList.remove("leaving","open"); old.style.top = "";
  room.classList.remove("slide-in");
  if (item) scrollToItem(item, true);
  busy = false; document.body.classList.remove("is-busy");
}

function navigate(){
  const {key, item} = parse();
  if (document.activeElement && document.activeElement.closest && document.activeElement.closest(".bar,.room-nav,.col")) document.activeElement.blur();
  const prev = current; current = key;
  if (busy){ show(key, item); return; }
  if (!prev && key) zoomIn(key, item);
  else if (prev && !key) zoomOut(prev);
  else if (prev && key && prev!==key) slideTo(prev, key, item);
  else if (key && item) scrollToItem(item, true);
  else show(key, item);
}


/* ---------- lightbox ---------- */
const LB = {el:document.getElementById("lb"), img:document.getElementById("lbImg"), cap:document.getElementById("lbCap"), count:document.getElementById("lbCount"), list:[], i:0, title:null, from:null};
function lbFill(){
  const a = LB.list[LB.i], n = a.dataset.name, c = CAPTIONS[n];
  LB.img.src = a.getAttribute("href");
  LB.img.alt = c ? c[1] : "";
  LB.cap.innerHTML = (c ? L(c) + " · " : "") + `<span class="t">${L(LB.title)}</span>`;
  LB.count.textContent = (LB.i+1) + " / " + LB.list.length;
  [1,-1].forEach(d=>{ const nb = LB.list[(LB.i + d + LB.list.length) % LB.list.length]; if (nb) (new Image()).src = nb.getAttribute("href"); });
}
function lbOpen(a){
  const g = a.closest(".gallery");
  LB.list = [...g.querySelectorAll(".gitem")]; LB.i = LB.list.indexOf(a);
  LB.title = (g.dataset.title||"|").split("|");
  LB.from = document.activeElement;
  LB.el.classList.toggle("single", LB.list.length < 2);
  LB.el.style.setProperty("--wall-now", getComputedStyle(document.body).backgroundColor);
  lbFill();
  LB.el.hidden = false; document.documentElement.style.overflow = "hidden";
  document.getElementById("lbClose").focus({preventScroll:true});
  if (REDUCED.matches) return;
  LB.el.animate([{opacity:0},{opacity:1}],{duration:350,easing:"ease"});
  /* grow from the thumbnail (same idea as the page zoom) */
  const t = a.querySelector("img"); if (!t) return;
  const go = ()=>{
    const r0 = t.getBoundingClientRect(), r1 = LB.img.getBoundingClientRect();
    if (!r1.width) return;
    LB.img.animate([{transform:`translate(${r0.left-r1.left}px,${r0.top-r1.top}px) scale(${r0.width/r1.width},${r0.height/r1.height})`},{transform:"none"}],{duration:650,easing:EASE_IN});
    LB.cap.animate([{opacity:0},{opacity:1}],{duration:400,delay:350,easing:"ease",fill:"backwards"});
  };
  if (LB.img.complete) go(); else LB.img.onload = ()=>{ LB.img.onload = null; go(); };
}
function lbClose(){
  if (LB.el.hidden) return;
  const end = ()=>{ LB.el.hidden = true; document.documentElement.style.overflow = ""; LB.img.removeAttribute("src"); if (LB.from) LB.from.focus({preventScroll:true}); };
  if (REDUCED.matches) return end();
  LB.el.animate([{opacity:1},{opacity:0}],{duration:280,easing:"ease"}).onfinish = end;
}
function lbStep(d){
  if (LB.list.length < 2) return;
  LB.i = (LB.i + d + LB.list.length) % LB.list.length;
  lbFill();
  if (!REDUCED.matches) LB.img.animate([{opacity:0,transform:`translateX(${d*24}px)`},{opacity:1,transform:"none"}],{duration:450,easing:EASE_IN});
}
document.getElementById("rooms").addEventListener("click", e=>{
  const a = e.target.closest(".gitem");
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault(); lbOpen(a);
});
document.getElementById("lbClose").addEventListener("click", lbClose);
document.getElementById("lbPrev").addEventListener("click", ()=>lbStep(-1));
document.getElementById("lbNext").addEventListener("click", ()=>lbStep(1));
LB.el.addEventListener("click", e=>{ if (e.target.classList.contains("lb-stage") || e.target === LB.el) lbClose(); });
document.addEventListener("keydown", e=>{
  if (LB.el.hidden) return;
  if (e.key === "Escape") lbClose();
  else if (e.key === "ArrowRight") lbStep(1);
  else if (e.key === "ArrowLeft") lbStep(-1);
  else if (e.key === "Tab"){ /* keep focus inside the viewer */
    const f = [...LB.el.querySelectorAll("button")].filter(b=>b.offsetParent!==null);
    const i = f.indexOf(document.activeElement);
    e.preventDefault(); f[(i + (e.shiftKey?-1:1) + f.length) % f.length].focus();
  }
});
let tx = null;
LB.el.addEventListener("touchstart", e=>{ tx = e.touches[0].clientX; }, {passive:true});
LB.el.addEventListener("touchend", e=>{ if (tx===null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) lbStep(dx < 0 ? 1 : -1); tx = null; });
window.addEventListener("hashchange", lbClose);

let saved = "zh"; try{ saved = localStorage.getItem("wytina-lang") || "zh"; }catch(e){}
setLang(saved);
renderHome(); renderRooms(); loadPhotos(document.getElementById("home")); loadBackground();
current = parse().key; show(current, parse().item, {cls:"enter"});
if (!current && !REDUCED.matches){ const b = document.querySelector(".band"); b.classList.add("load"); setTimeout(()=>b.classList.remove("load"), 1400); }
window.addEventListener("hashchange", navigate);
let lastY = 0;
window.addEventListener("scroll", ()=>{ const y = window.scrollY; if (Math.abs(y-lastY) < 6) return; document.body.classList.toggle("scroll-down", y > lastY && y > 80); lastY = y; }, {passive:true});
if (PORTRAIT.addEventListener) PORTRAIT.addEventListener("change", loadBackground);
</script>
